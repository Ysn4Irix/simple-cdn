services:
  simple-cdn:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simple-static-cdn
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - CDN_HOST=0.0.0.0
      - CDN_PORT=8080
      - CDN_BASE_URL=http://localhost:8080
      - CDN_STORAGE_DIR=/data
      - CDN_MAX_UPLOAD_SIZE_MB=100
      - CDN_CACHE_CONTROL=public, max-age=31536000, immutable
      - CDN_ENABLE_GZIP=true
      - CDN_API_KEY=cdn-secret-api-key-change-me
      - CDN_SECRET_KEY=hmac-signing-secret-change-me
      - CDN_REQUIRE_SIGNED_URLS=false
      - CDN_RATE_LIMIT_RPS=100
      - CDN_RATE_LIMIT_BURST=200
    volumes:
      - ./data:/data
