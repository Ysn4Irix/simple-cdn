services:
  simple-cdn:
    build:
      context: .
      dockerfile: Dockerfile
    image: simple-static-cdn:latest
    container_name: simple-static-cdn
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - CDN_PORT=8080
      - CDN_HOST=0.0.0.0
      - CDN_BASE_URL=${CDN_BASE_URL:-http://localhost:8080}
      - CDN_STORAGE_DIR=/data
      - CDN_MAX_UPLOAD_SIZE_MB=${CDN_MAX_UPLOAD_SIZE_MB:-100}
      - CDN_CACHE_CONTROL=${CDN_CACHE_CONTROL:-public, max-age=31536000, immutable}
      - CDN_ENABLE_GZIP=true
      - CDN_API_KEY=${CDN_API_KEY:-cdn-secret-api-key-change-me}
      - CDN_SECRET_KEY=${CDN_SECRET_KEY:-hmac-signing-secret-change-me}
      - CDN_REQUIRE_SIGNED_URLS=${CDN_REQUIRE_SIGNED_URLS:-false}
      - CDN_ALLOWED_REFERRERS=${CDN_ALLOWED_REFERRERS:-}
      - CDN_ALLOWED_ORIGINS=${CDN_ALLOWED_ORIGINS:-*}
      - CDN_RATE_LIMIT_RPS=${CDN_RATE_LIMIT_RPS:-100}
      - CDN_RATE_LIMIT_BURST=${CDN_RATE_LIMIT_BURST:-200}
    volumes:
      - cdn_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  cdn_data:
    driver: local
