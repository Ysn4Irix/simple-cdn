name: CI / CD & Automated Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Unformatted files found:"
            gofmt -l .
            exit 1
          fi

      - name: Run unit & integration tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Test build server binary
        run: CGO_ENABLED=0 go build -v -ldflags="-s -w" -o cdn-server ./cmd/server

  docker-validate:
    name: Validate Docker Build (PR)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: simple-static-cdn:test

  publish-and-release:
    name: Auto Tag, Build Image & Publish Release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Automatically bump version and create git tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          INITIAL_VERSION: 0.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.tag_version.outputs.new_tag }}
            type=raw,value=latest

      - name: Build and push multi-arch Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go for cross-compilation
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          targets=(
            "linux/amd64/cdn-server-linux-amd64"
            "linux/arm64/cdn-server-linux-arm64"
            "darwin/amd64/cdn-server-darwin-amd64"
            "darwin/arm64/cdn-server-darwin-arm64"
            "windows/amd64/cdn-server-windows-amd64.exe"
          )
          for target in "${targets[@]}"; do
            IFS="/" read -r os arch filename <<< "$target"
            echo "Building $os/$arch -> dist/$filename..."
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/$filename" ./cmd/server
          done
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
